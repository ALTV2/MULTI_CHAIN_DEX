apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexer
  namespace: multichain-dex
  labels:
    app: indexer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: indexer
  template:
    metadata:
      labels:
        app: indexer
    spec:
      containers:
        - name: indexer
          # Build locally and load into Kind (see README); not pulled from a registry.
          image: dex-indexer:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: dex-config
            - secretRef:
                name: dex-secret
          readinessProbe:
            httpGet:
              path: /api/v2/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v2/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              memory: "768Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: indexer
  namespace: multichain-dex
spec:
  selector:
    app: indexer
  ports:
    - port: 8080
      targetPort: 8080
