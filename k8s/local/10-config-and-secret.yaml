# Non-secret configuration shared by the backend services.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dex-config
  namespace: multichain-dex
data:
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "multichain_dex"
  DB_USER: "dex"

  INDEXER_ENABLED: "true"
  INDEXER_INTERVAL: "10000"
  CORS_ORIGINS: "http://dex.localhost"

  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  NOTIFICATIONS_TOPIC: "dex.orders"

  # Public SUI testnet endpoint — not a secret.
  SUI_RPC_URL: "https://fullnode.testnet.sui.io:443"

  # SMTP sink (mailpit). Override for a real provider.
  MAIL_HOST: "mailpit"
  MAIL_PORT: "1025"
  MAIL_SMTP_AUTH: "false"
  MAIL_SMTP_STARTTLS: "false"
  NOTIFICATIONS_FROM: "noreply@multichain-dex.local"
---
# Secrets. The committed values are PLACEHOLDERS — replace before applying, or
# create the secret out-of-band:
#   kubectl -n multichain-dex create secret generic dex-secret \
#     --from-literal=DB_PASSWORD=... \
#     --from-literal=SEPOLIA_RPC_URL='https://eth-sepolia.g.alchemy.com/v2/YOUR_KEY' \
#     --from-literal=POLYGON_RPC_URL='https://polygon-amoy.g.alchemy.com/v2/YOUR_KEY'
apiVersion: v1
kind: Secret
metadata:
  name: dex-secret
  namespace: multichain-dex
type: Opaque
stringData:
  DB_PASSWORD: "dex_password"
  # Server-side only — never exposed to the browser. Replace YOUR_KEY.
  SEPOLIA_RPC_URL: "https://eth-sepolia.g.alchemy.com/v2/YOUR_KEY"
  POLYGON_RPC_URL: "https://polygon-amoy.g.alchemy.com/v2/YOUR_KEY"
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
