apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: multichain-dex
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # NEXT_PUBLIC_* values are inlined at build time, so the image MUST be built
          # with --build-arg NEXT_PUBLIC_API_URL=http://dex.localhost/api/v2 (see README).
          image: dex-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://dex.localhost/api/v2"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              memory: "384Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: multichain-dex
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
