<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${subject}">Order status updated</title>
</head>
<body style="font-family: Arial, Helvetica, sans-serif; color: #1a1a1a; background: #f5f6f8; margin: 0; padding: 24px;">
<div style="max-width: 560px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 28px;">
    <h2 style="margin-top: 0;" th:text="${subject}">Order status updated</h2>

    <p>The status of your cross-chain swap has changed.</p>

    <table style="width: 100%; border-collapse: collapse; margin: 16px 0;">
        <tr>
            <td style="padding: 6px 0; color: #666;">Phase</td>
            <td style="padding: 6px 0; font-weight: bold;" th:text="${event.phase}">PHASE</td>
        </tr>
        <tr>
            <td style="padding: 6px 0; color: #666;">Order</td>
            <td style="padding: 6px 0;" th:text="${event.onChainOrderId} + ' (' + ${event.orderType} + ')'">#0</td>
        </tr>
        <tr>
            <td style="padding: 6px 0; color: #666;">Selling</td>
            <td style="padding: 6px 0;" th:text="${event.sellAmount} + ' ' + ${event.sellSymbol}">amount</td>
        </tr>
        <tr>
            <td style="padding: 6px 0; color: #666;">Buying</td>
            <td style="padding: 6px 0;" th:text="${event.buyAmount} + ' ' + ${event.buySymbol}">amount</td>
        </tr>
        <tr th:if="${event.sourceChainName != null}">
            <td style="padding: 6px 0; color: #666;">Route</td>
            <td style="padding: 6px 0;" th:text="${event.sourceChainName} + (${event.targetChainName} != null ? ' → ' + ${event.targetChainName} : '')">route</td>
        </tr>
    </table>

    <p style="color: #888; font-size: 12px;">
        You receive this email because you opted in to notifications for this order on the Multi-Chain DEX.
        This is an automated message — please do not reply.
    </p>
</div>
</body>
</html>
