spring:
  application:
    name: multichain-dex-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:multichain_dex}
    username: ${DB_USER:dex}
    password: ${DB_PASSWORD:dex_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-change-in-production}
  expiration: ${JWT_EXPIRATION:86400000}  # 24 hours in milliseconds

# Blockchain Configuration
blockchain:
  ethereum:
    rpc-url: ${ETHEREUM_RPC_URL:https://sepolia.infura.io/v3/YOUR_KEY}
    chain-id: ${ETHEREUM_CHAIN_ID:11155111}
    htlc-address: ${ETHEREUM_HTLC_ADDRESS:}
    cross-chain-order-book-address: ${ETHEREUM_CCOB_ADDRESS:}

  polygon:
    rpc-url: ${POLYGON_RPC_URL:https://rpc-amoy.polygon.technology}
    chain-id: ${POLYGON_CHAIN_ID:80002}
    htlc-address: ${POLYGON_HTLC_ADDRESS:}
    cross-chain-order-book-address: ${POLYGON_CCOB_ADDRESS:}

# Encryption for wallet storage
encryption:
  key: ${ENCRYPTION_KEY:your-32-byte-encryption-key-here}

# CORS Configuration
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}

# Logging
logging:
  level:
    com.multichain.dex: DEBUG
    org.web3j: INFO
    org.springframework.security: DEBUG

# Swagger/OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
