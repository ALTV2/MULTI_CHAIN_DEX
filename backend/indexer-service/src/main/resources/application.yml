server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:multichain_dex}
    username: ${DB_USER:dex}
    password: ${DB_PASSWORD:dex_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  # Kafka producer: publishes order phase events to the notification service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

# Indexer configuration
indexer:
  enabled: ${INDEXER_ENABLED:true}
  polling-interval: ${INDEXER_INTERVAL:10000}
  tx-confirm-timeout: ${TX_CONFIRM_TIMEOUT:120000}

# Notification event publication
notifications:
  kafka:
    topic: ${NOTIFICATIONS_TOPIC:dex.orders}

# CORS
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

# Logging
logging:
  level:
    com.multichain.dex: DEBUG
    com.multichain.dex.service.indexer: INFO
    org.web3j: WARN
    org.hibernate.SQL: WARN
    org.springframework.web: INFO
