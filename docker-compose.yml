services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-multichain_dex}
      POSTGRES_USER: ${DB_USER:-dex}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dex_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dex} -d ${DB_NAME:-multichain_dex}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dex-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Database
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-multichain_dex}
      DB_USER: ${DB_USER:-dex}
      DB_PASSWORD: ${DB_PASSWORD:-dex_password}

      # RPC URLs (Alchemy — server-side only, never exposed to browser)
      SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL:-https://eth-sepolia.g.alchemy.com/v2/VPxg_-3LrpC7xW0yO-AGi}
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-https://polygon-amoy.g.alchemy.com/v2/VPxg_-3LrpC7xW0yO-AGi}
      SUI_RPC_URL: ${SUI_RPC_URL:-https://sui-testnet.g.alchemy.com/v2/VPxg_-3LrpC7xW0yO-AGi}

      # Indexer
      INDEXER_ENABLED: ${INDEXER_ENABLED:-true}
      INDEXER_INTERVAL: ${INDEXER_INTERVAL:-10000}

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dex-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Frontend only needs backend API URL — no Alchemy keys
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v2}
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v2}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - dex-network

volumes:
  postgres_data:

networks:
  dex-network:
    driver: bridge
