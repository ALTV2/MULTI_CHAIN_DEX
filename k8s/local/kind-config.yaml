# Kind cluster for local end-to-end runs.
#   kind create cluster --name dex --config k8s/local/kind-config.yaml
# The control-plane node is labelled ingress-ready and maps ports 80/443 to the
# host so the ingress-nginx controller is reachable at http://localhost.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dex
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
